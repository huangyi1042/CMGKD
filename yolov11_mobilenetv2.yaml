nc: 4

backbone:
  # 0: MobileNetV2 主干
  # width_mult=0.5
  # 输出 P3=16, P4=48, P5=160
  - [-1, 1, MobileNetV2Backbone, [0.5, False]]

  # 1: P3, 1/8
  - [0, 1, Index, [16, 0]]

  # 2: P4, 1/16
  - [0, 1, Index, [48, 1]]

  # 3: P5, 1/32
  - [0, 1, Index, [160, 2]]

head:
  # P5 特征处理
  - [3, 1, Conv, [128, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, False]]

  # 生成 P3 检测特征
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 1, C3k2, [64, False]]

  # PAN 下采样生成 P4
  - [-1, 1, Conv, [96, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, False]]

  # PAN 下采样生成 P5
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [160, False]]

  # Detect P3, P4, P5
  - [[10, 13, 16], 1, Detect, [nc]]